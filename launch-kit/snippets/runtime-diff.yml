name: Garnet runtime diff policy (opt-in)

on:
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  pull-requests: read

concurrency:
  group: garnet-runtime-diff-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'garnet-runtime-review[bot]' &&
      contains(github.event.comment.body, '<!-- garnet-runtime-review -->')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Evaluate the head-bound record and publish the policy check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          if [[ $(jq -r '.state' <<< "$pr") != open ]]; then
            exit 0
          fi
          head=$(jq -er '.head.sha | select(test("^[a-f0-9]{40}$"))' <<< "$pr")
          request=$(jq -cn --arg org "${REPOSITORY%/*}" --arg repo "${REPOSITORY#*/}" --argjson pr "$PR_NUMBER" '
            {jsonrpc: "2.0", id: 1, method: "tools/call",
             params: {name: "pr_review", arguments: {githubOrg: $org, repo: $repo, pullNumber: $pr}}}')
          conclusion=failure
          summary='Repository policy requires a finalized, head-bound unchanged record with declared capture.'
          if curl -fsS --max-time 30 https://api.garnet.ai/api/v2/mcp \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            --data "$request" |
            jq -e --arg head "$head" '
              .result | select(type == "object" and .isError != true)
              | (.structuredContent // (.content[0].text | fromjson))
              | .bound_to_head == true and .head_sha == $head and .marker_commit == $head
                and .status == "finalized" and .result == "unchanged"
                and (.capture_quality == "best-effort" or .capture_quality == "complete")
            ' >/dev/null; then
            conclusion=success
            summary='The current-head record reports no new behavior within the comparison scope.'
          fi

          jq -cn --arg head "$head" --arg conclusion "$conclusion" --arg summary "$summary" '
            {name: "garnet/runtime-diff", head_sha: $head, status: "completed", conclusion: $conclusion,
             output: {title: "Garnet runtime diff policy", summary: $summary}}' |
            gh api --method POST "repos/$REPOSITORY/check-runs" --input - --silent
          [[ "$conclusion" == success ]]
