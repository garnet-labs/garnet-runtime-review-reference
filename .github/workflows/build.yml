name: build

on:
  pull_request:
    paths:
      - "kolbo-mcp-check/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2.2.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          api_url: https://api.garnet.ai

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: kolbo-mcp-check
        run: npm install --no-package-lock

      - name: Build
        working-directory: kolbo-mcp-check
        run: npm run build

      - name: Settle
        if: always()
        run: sleep 45
