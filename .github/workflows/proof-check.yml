# Living proof — re-asserts the Garnet × stamphog decision rule on a schedule.
#
# This is the "the proof still holds" badge. It runs the vendored production
# engine's runtime-evidence suites — the tree parser, the gate-profile marker
# consumer, and the status/body delivery surfaces (clean / loud / stale /
# pending / legend records among the cases). No network, no LLM key required —
# so it stays green only while the core A/B behaviour is intact.
name: Living Proof

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Re-assert the runtime-review A/B
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the living-proof suite
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/pr-approval-agent:${{ github.workspace }}/tools/owners
        run: |
          set -o pipefail
          uv run --with pytest --with pyyaml python -m pytest \
            tools/pr-approval-agent/test_runtime_evidence.py \
            tools/pr-approval-agent/test_gate_profile.py \
            tools/pr-approval-agent/test_evidence_body.py \
            tools/pr-approval-agent/test_evidence_status.py \
            -v | tee proof-output.txt
          {
            echo "## Living proof — runtime-review A/B still holds"
            echo ""
            echo '```'
            cat proof-output.txt
            echo '```'
            echo ""
            echo "Clean record lifts the deps deny · off-baseline egress keeps it and names the destination · stale/pending/missing records WAIT · the comment legend is never parsed as egress · the bypass is scoped to dependency files only."
          } >> "$GITHUB_STEP_SUMMARY"
