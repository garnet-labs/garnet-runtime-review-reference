# Proof check — re-asserts that the README's proof loop is still true, and that
# the repository-policy example still behaves.
#
# Job `proof` asserts the front door: the exhibit pull request, its Execution
# Profile permalink and the public JSON endpoint all answer 200 logged out, the
# head SHA in the README is still the exhibit's head, and the README stays
# inside the ratified vocabulary.
#
# Job `policy-example` runs the vendored stamphog engine's suites — the tree
# parser, the gate-profile marker consumer, and the status/body delivery
# surfaces. That gate is an example of repository policy consuming an Execution
# Profile; it is not what Garnet produces.
#
# Both jobs only read.
name: Proof check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "README.md"
      - "scripts/check-proof.mjs"
      - ".github/workflows/proof-check.yml"
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Assert the public proof loop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Check the README's proof loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-proof.mjs

  policy-example:
    name: Re-assert the repository-policy example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run the policy-example suite
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/pr-approval-agent:${{ github.workspace }}/tools/owners
        run: |
          set -o pipefail
          uv run --with pytest --with pyyaml python -m pytest \
            tools/pr-approval-agent/test_runtime_evidence.py \
            tools/pr-approval-agent/test_gate_profile.py \
            tools/pr-approval-agent/test_evidence_body.py \
            tools/pr-approval-agent/test_evidence_status.py \
            -v | tee proof-output.txt
          {
            echo "## Repository-policy example — the gate still behaves"
            echo ""
            echo '```'
            cat proof-output.txt
            echo '```'
            echo ""
            echo "Clean record lifts the deps deny · off-baseline egress keeps it and names the destination · stale/pending/missing records WAIT · the comment legend is never parsed as egress · the bypass is scoped to dependency files only."
          } >> "$GITHUB_STEP_SUMMARY"
