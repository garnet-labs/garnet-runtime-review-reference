name: Launch kit

on:
  pull_request:
    paths:
      - "launch-kit/**"
      - ".github/workflows/launch-kit.yml"
  push:
    branches: [main]
    paths:
      - "launch-kit/**"
      - ".github/workflows/launch-kit.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: garnet-org/action@24833a47c19aad605bb10bcd9b8cad8f318ca187 # v2.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --test launch-kit/test/skill-parity.test.js
      - run: npm test --prefix launch-kit/sample
      - name: Request the example page
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null https://example.org/
