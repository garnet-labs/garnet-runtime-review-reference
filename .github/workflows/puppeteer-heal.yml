name: Puppeteer heal

on:
  pull_request:
    paths:
      - "examples/puppeteer-heal/**"
      - ".github/workflows/puppeteer-heal.yml"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: garnet-org/action@24833a47c19aad605bb10bcd9b8cad8f318ca187 # v2.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Puppeteer
        working-directory: examples/puppeteer-heal
        run: npm install --no-audit --no-fund
